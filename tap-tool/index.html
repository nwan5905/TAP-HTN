  button { font: inherit; font-weight: 500; padding: 8px 12px; margin-top: 12px;
    background: #185FA5; color: white; border: 0; border-radius: 6px;
    cursor: pointer; width: 100%; height: 36px; }
  button:hover { background: #13548f; }
  .err { color: #791F1F; background: #FCEBEB; padding: 6px 10px;
    border-radius: 6px; margin-top: 10px; font-size: 13px; min-height: 0; }

const ITERATIONS = 200000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(pw), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(SALT), iterations: ITERATIONS, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const ptBuf = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(IV) }, key, b64(CT)
  );
  const html = new TextDecoder().decode(ptBuf);
  document.open();
  document.write(html);
  document.close();
}

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    await unlock(pw);
  } catch (ex) {
    err.textContent = "Wrong password.";
    document.getElementById("pw").select();
  }
});
