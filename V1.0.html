const ITERATIONS = 200000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(pw), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(SALT), iterations: ITERATIONS, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const ptBuf = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(IV) }, key, b64(CT)
  );
  const html = new TextDecoder().decode(ptBuf);
  document.open();
  document.write(html);
  document.close();
}

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    await unlock(pw);
  } catch (ex) {
    err.textContent = "Wrong password.";
    document.getElementById("pw").select();
  }
});
